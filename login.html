<script>
// Choose a different one of 10 distinct fall animations each time a card loops.
(()=>{
 const cards=[...document.querySelectorAll('.play-card')];
 const lastEffect=new WeakMap();
 const randomize=card=>{
  let next=Math.floor(Math.random()*10);
  const previous=lastEffect.get(card);
  if(previous!==undefined){while(next===previous)next=Math.floor(Math.random()*10);}
  lastEffect.set(card,next);
  for(let i=0;i<10;i++)card.classList.remove('m'+i);
  card.classList.add('m'+next);
  card.style.setProperty('--duration',(6.5+Math.random()*4.5).toFixed(2)+'s');
 };
 cards.forEach(card=>{
  randomize(card);
  card.addEventListener('animationiteration',()=>randomize(card));
 });
})();
const TPD_CONFIG=window.TPD_SUPABASE_CONFIG||{};
const TPD_CONFIG_READY=typeof TPD_CONFIG.url==='string'&&TPD_CONFIG.url.startsWith('https://')&&typeof TPD_CONFIG.publishableKey==='string'&&TPD_CONFIG.publishableKey.length>20&&!TPD_CONFIG.url.includes('YOUR_')&&!TPD_CONFIG.publishableKey.includes('YOUR_');
const TPD_CLIENT=TPD_CONFIG_READY&&window.supabase?window.supabase.createClient(TPD_CONFIG.url,TPD_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const showAuthError=(message)=>alert(message);
const setAuthBusy=(busy)=>['googleBtn','facebookBtn','guestBtn'].forEach(id=>{const b=document.getElementById(id);b.disabled=busy;b.style.opacity=busy?'.65':'1'});
async function tpdOAuth(provider){
 if(!TPD_CLIENT){showAuthError('Supabase setup baaki hai. supabase-config.js mein game project ka URL aur publishable key add karna hoga.');return}
 setAuthBusy(true);
 const {error}=await TPD_CLIENT.auth.signInWithOAuth({provider,options:{redirectTo:new URL('./lobby.html',location.href).href,queryParams:provider==='google'?{prompt:'select_account'}:undefined}});
 if(error){setAuthBusy(false);showAuthError(error.message)}
}
document.getElementById('googleBtn').addEventListener('click',()=>tpdOAuth('google'));
document.getElementById('facebookBtn').addEventListener('click',()=>tpdOAuth('facebook'));
document.getElementById('guestBtn').addEventListener('click',async()=>{
 if(!TPD_CLIENT){showAuthError('Supabase setup baaki hai. Pehle game project ka URL aur publishable key configure karo.');return}
 setAuthBusy(true);
 const {data,error}=await TPD_CLIENT.auth.signInAnonymously({options:{data:{name:'Guest Player',display_name:'Guest Player'}}});
 if(error){setAuthBusy(false);showAuthError(error.message);return}
 location.href='./lobby.html?v=27';
});
if(TPD_CLIENT){
 TPD_CLIENT.auth.getSession().then(({data})=>{if(data.session)location.replace('./lobby.html?v=27')});
}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=27',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}));
if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone){
 const lock=()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});};
 lock();window.addEventListener('load',lock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});
}
</script>

<script>
/* Ask the browser to check for a new app shell whenever the installed app opens. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js?v=27', { updateViaCache: 'none' });
      await registration.update();
      if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    } catch (error) {
      console.warn('App update check failed', error);
    }
  });
}
</script>
