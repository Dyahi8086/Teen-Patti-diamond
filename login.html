<title>Teen Patti Diamond | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Manrope,sans-serif;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:pan-x}
body{height:100dvh;min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 35% 45%,#7b00c6 0%,#31004e 52%,#100019 100%);display:flex;align-items:center;justify-content:center;padding:24px}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #e6a9ff28;border-radius:50%;width:70vw;height:70vw;max-width:850px;max-height:850px}body:after{box-shadow:0 0 80px #8b26d522 inset}.sparkle{position:fixed;pointer-events:none;color:#ffe49a;text-shadow:0 0 12px #ffcc55;opacity:.75;z-index:0}.sparkle.one{left:7%;top:18%;font-size:20px}.sparkle.two{right:8%;top:24%;font-size:14px}.sparkle.three{right:45%;bottom:12%;font-size:18px}.top-tools{position:fixed;z-index:5;right:18px;top:14px;display:flex;gap:9px}.tool-btn{width:38px;height:38px;border-radius:50%;border:1px solid #ffd77a66;background:#2d0645aa;color:#ffe6a2;display:grid;place-items:center;font-size:19px;cursor:pointer;backdrop-filter:blur(8px)}
body:before{left:-30vw;top:-38vw}body:after{right:-35vw;bottom:-40vw}
.page{position:relative;z-index:1;width:min(1380px,100%);height:100dvh;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"login art";gap:clamp(20px,4vw,60px);align-items:center;margin:auto}
.art{grid-area:art;min-width:0;height:100%;max-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}.art:before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:7%;height:18%;background:radial-gradient(ellipse,#ffca5d75 0%,#a72bff38 38%,transparent 73%);filter:blur(14px)}.art:after{content:"";position:absolute;z-index:-1;left:12%;right:12%;bottom:5%;height:2px;background:linear-gradient(90deg,transparent,#ffd36d,#fff0b1,#ffd36d,transparent);box-shadow:0 0 20px 7px #ffb52d44;border-radius:50%}
.character{display:block;width:auto;height:88dvh;max-width:100%;max-height:100%;min-height:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 30px #d54affaa) drop-shadow(0 14px 12px #160020aa);margin:0;flex:0 1 auto;user-select:none;-webkit-user-drag:none;pointer-events:none}

.login{grid-area:login;width:100%;max-width:520px;margin:auto;text-align:center;padding:20px 8px;background:transparent;border:0;box-shadow:none;transform:translateY(2vh)}
.offer{font:700 clamp(22px,3vw,32px) Cinzel,serif;color:#ffe4a0;text-shadow:0 2px 12px #ffb52d66;margin:0 0 24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:12px 22px;border:1px solid #ffd77a55;border-radius:999px;background:linear-gradient(110deg,#260039cc,#5a1478aa,#260039cc);box-shadow:inset 0 1px 0 #fff5c044,0 8px 22px #16002066}.offer:before{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}.offer:after{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}
.action{cursor:pointer;transition:transform .15s,filter .15s;position:relative;overflow:hidden}.action:active,.social-btn:active,.guest-btn:active{transform:translateY(2px) scale(.97);filter:brightness(1.12)}
.clay:before{content:"";position:absolute;inset:3px;border-radius:inherit;border:1px solid #ffffff22;pointer-events:none}



.usericon{font-size:0;width:25px;height:25px;position:relative;flex:0 0 25px}.usericon:before{content:"";position:absolute;top:0;left:8px;width:10px;height:10px;border-radius:50%;background:#e9edf4}.usericon:after{content:"";position:absolute;left:3px;bottom:0;width:20px;height:14px;border-radius:12px 12px 4px 4px;background:#e9edf4}
.bonus-message{display:none;min-height:42px;margin:0 auto 14px;max-width:460px;display:flex;align-items:center;justify-content:center;padding:7px 12px;color:#ffe7ad;font:700 clamp(12px,1.55vw,17px) Manrope,sans-serif;text-align:center;line-height:1.35;letter-spacing:.2px;text-shadow:0 0 12px #ffca5d88;opacity:0;transform:translateY(7px);transition:opacity .8s ease,transform .8s ease}.bonus-message.show{opacity:1;transform:translateY(0)}.brand-logo{display:block;width:min(390px,88%);height:auto;max-height:170px;object-fit:contain;margin:0 auto 20px;filter:drop-shadow(0 8px 18px #d94cff66);user-select:none;-webkit-user-drag:none;pointer-events:none}.social-row{display:flex;justify-content:center;gap:12px;margin:0 auto 12px}.social-btn{width:62px;height:54px;border-radius:17px;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;border:1px solid #ffffff55;box-shadow:5px 5px 12px #10001888,-4px -4px 12px #ffffff18,inset 2px 2px 5px #ffffff66,inset -3px -3px 6px #0005}.social-btn svg{width:27px;height:27px;position:relative;z-index:1}.facebook{color:#fff;background:linear-gradient(145deg,#66b4ff 0%,#1877f2 48%,#0755b8 100%);border-color:#a9d7ff;box-shadow:5px 6px 13px #080d2688,-3px -3px 10px #ffffff35,inset 2px 2px 5px #ffffff88,inset -3px -3px 7px #003d8c}.google{background:linear-gradient(145deg,#623a7d,#2b1044)}.guest-btn{width:156px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto;color:#fff;font:700 16px Manrope;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(145deg,#424b59,#151a25 70%);border:1px solid #a9b4c455;box-shadow:5px 5px 12px #10001899,-4px -4px 12px #ffffff14,inset 2px 2px 5px #ffffff30,inset -3px -3px 7px #0009}.legal{font-size:10px;color:#d9b7ed;line-height:1.7;margin:7px 0 0}.legal a{color:#ffe2a0;text-decoration:underline;text-underline-offset:2px}.note{font-size:11px;color:#d9b7ed;line-height:1.6;margin-top:12px}
@media(max-width:700px) and (orientation:portrait){body{padding:8px 14px}.page{height:100%;grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-template-areas:"art" "login";gap:0;max-width:460px}.art{height:100%;max-height:42dvh;gap:0}.character{height:38dvh;max-height:100%;width:auto;max-width:100%;object-fit:contain;object-position:center bottom}.brand{font-size:clamp(25px,7vw,34px);margin:0}.diamond{font-size:15px;padding:4px 18px}.login{padding:8px 5px;transform:translateY(3vh)}.bonus-message{min-height:38px;margin-bottom:8px;font-size:12px}.offer{font-size:18px;margin-bottom:8px;padding:8px 14px}.brand-logo{width:min(300px,82%);max-height:110px;margin-bottom:12px}.login-brand span{font-size:clamp(24px,7vw,32px)}.social-btn{width:58px;height:50px}.guest-btn{width:145px;height:44px}.note{margin-top:6px}.legal{font-size:9px;margin-top:3px}.top-tools{top:8px;right:8px}}
@media(orientation:landscape){body{padding:0 3vw}.page{grid-template-columns:.95fr 1.05fr;grid-template-areas:"login art";gap:2vw;max-width:1380px}.character{height:88dvh;max-height:100%;width:auto;max-width:100%;object-fit:contain;object-position:center bottom;margin:0}.brand{font-size:clamp(30px,4.2vw,56px)}.diamond{font-size:clamp(16px,1.9vw,23px);padding:5px 20px}.offer{font-size:clamp(20px,2.2vw,29px);margin-bottom:18px}.brand-logo{width:min(350px,88%);max-height:145px;margin-bottom:16px}.social-btn{width:62px;height:54px}.guest-btn{width:156px;height:48px}.note{margin-top:10px}}

/* Random small cards falling in 10 different paths */
.art{isolation:isolate}.character{position:relative;z-index:1}
.card-sprinkle{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.play-card{position:absolute;top:-90px;width:clamp(27px,3.3vw,42px);height:clamp(41px,5vw,63px);border-radius:5px;background:linear-gradient(145deg,#fff,#f2eee8);border:1px solid #d7d0c8;box-shadow:0 5px 12px #08000d77,inset 0 0 0 1px #fff;display:flex;align-items:center;justify-content:center;color:#151515;font-family:Georgia,serif;font-weight:700;will-change:transform,opacity;animation-duration:var(--duration,8s);animation-delay:var(--delay,0s);animation-timing-function:linear;animation-iteration-count:infinite}
.play-card.red{color:#d71935}.play-card .pip{font-size:clamp(16px,1.9vw,24px);line-height:1}.play-card .corner{position:absolute;left:4px;top:3px;font-size:clamp(7px,.8vw,10px);line-height:.9;text-align:center}.play-card .corner.bottom{left:auto;top:auto;right:4px;bottom:3px;transform:rotate(180deg)}.play-card .face{font-size:clamp(17px,2vw,24px);text-shadow:0 1px #d9a84d}.play-card .crown{position:absolute;top:12px;font-size:9px;color:#d49a22}
.play-card.joker{background:linear-gradient(145deg,#fff9d9,#fff 55%,#f0ddff);color:#6923a5}.play-card.joker .pip{font-size:9px;letter-spacing:-.5px}.play-card.joker:after{content:"★";position:absolute;bottom:8px;font-size:12px;color:#c02b51}
.play-card.c1{left:2%}.play-card.c2{left:14%}.play-card.c3{left:27%}.play-card.c4{right:27%}.play-card.c5{right:14%}.play-card.c6{right:2%}.play-card.c7{left:8%}.play-card.c8{right:8%}.play-card.c9{left:36%}.play-card.c10{right:36%}
@keyframes cardFall0{0%{transform:translate(-12vw,-10vh) rotate(-35deg) scale(.72);opacity:0}12%{opacity:1}55%{transform:translate(5vw,52vh) rotate(95deg) scale(1.04)}100%{transform:translate(-7vw,115vh) rotate(230deg) scale(.82);opacity:0}}
@keyframes cardFall1{0%{transform:translate(10vw,-12vh) rotate(28deg) scale(1.15);opacity:0}10%{opacity:1}50%{transform:translate(-8vw,50vh) rotate(-120deg) scale(.8)}100%{transform:translate(13vw,115vh) rotate(-280deg) scale(1.1);opacity:0}}
@keyframes cardFall2{0%{transform:translate(0,-10vh) rotate(0) scale(.65);opacity:0}15%{opacity:1}35%{transform:translate(8vw,35vh) rotate(130deg) scale(1.2)}70%{transform:translate(-7vw,78vh) rotate(260deg) scale(.85)}100%{transform:translate(2vw,115vh) rotate(390deg) scale(1);opacity:0}}
@keyframes cardFall3{0%{transform:translate(-8vw,-8vh) rotate(65deg) scale(1);opacity:0}10%{opacity:1}40%{transform:translate(12vw,40vh) rotate(-75deg) scale(.7)}100%{transform:translate(-14vw,115vh) rotate(-330deg) scale(1.15);opacity:0}}
@keyframes cardFall4{0%{transform:translate(12vw,-10vh) rotate(-55deg) scale(.85);opacity:0}12%{opacity:1}60%{transform:translate(-13vw,65vh) rotate(180deg) scale(1.18)}100%{transform:translate(8vw,115vh) rotate(360deg) scale(.72);opacity:0}}
@keyframes cardFall5{0%{transform:translate(0,-12vh) rotate(90deg) scale(1.2);opacity:0}10%{opacity:1}30%{transform:translate(-12vw,28vh) rotate(0) scale(.75)}65%{transform:translate(10vw,75vh) rotate(-180deg) scale(1.1)}100%{transform:translate(-4vw,115vh) rotate(-360deg) scale(.9);opacity:0}}
@keyframes cardFall6{0%{transform:translate(-15vw,-10vh) rotate(-10deg) scale(.9);opacity:0}12%{opacity:1}45%{transform:translate(4vw,48vh) rotate(210deg) scale(1.2)}100%{transform:translate(16vw,115vh) rotate(420deg) scale(.7);opacity:0}}
@keyframes cardFall7{0%{transform:translate(15vw,-10vh) rotate(45deg) scale(.7);opacity:0}10%{opacity:1}50%{transform:translate(-4vw,55vh) rotate(-200deg) scale(1.15)}100%{transform:translate(-12vw,115vh) rotate(-420deg) scale(.95);opacity:0}}
@keyframes cardFall8{0%{transform:translate(-4vw,-12vh) rotate(-90deg) scale(1.1);opacity:0}12%{opacity:1}35%{transform:translate(14vw,34vh) rotate(100deg) scale(.75)}75%{transform:translate(-10vw,83vh) rotate(280deg) scale(1.15)}100%{transform:translate(5vw,115vh) rotate(500deg) scale(.8);opacity:0}}
@keyframes cardFall9{0%{transform:translate(8vw,-10vh) rotate(15deg) scale(.8);opacity:0}10%{opacity:1}25%{transform:translate(-10vw,25vh) rotate(160deg) scale(1.2)}60%{transform:translate(12vw,68vh) rotate(300deg) scale(.72)}100%{transform:translate(-5vw,115vh) rotate(540deg) scale(1.05);opacity:0}}
.play-card.m0{animation-name:cardFall0}.play-card.m1{animation-name:cardFall1}.play-card.m2{animation-name:cardFall2}.play-card.m3{animation-name:cardFall3}.play-card.m4{animation-name:cardFall4}.play-card.m5{animation-name:cardFall5}.play-card.m6{animation-name:cardFall6}.play-card.m7{animation-name:cardFall7}.play-card.m8{animation-name:cardFall8}.play-card.m9{animation-name:cardFall9}
@media(max-width:700px) and (orientation:portrait){.play-card{width:24px;height:36px}.play-card .pip{font-size:14px}.play-card .face{font-size:14px}.play-card .corner{font-size:6px}}
@media(prefers-reduced-motion:reduce){.play-card{animation:none;opacity:.55;top:12%}}

</style>
</head>
<body>
<main class="page">
<section class="art" aria-label="Teen Patti Diamond character">

<div class="card-sprinkle" aria-hidden="true">

<span class="play-card c4"><span class="corner">5<br>♣</span><span class="pip">♣</span><span class="corner bottom">5<br>♣</span></span>
<span class="play-card c5"><span class="corner">6<br>♠</span><span class="pip">♠</span><span class="corner bottom">6<br>♠</span></span>
<span class="play-card red c6"><span class="corner">7<br>♦</span><span class="pip">♦</span><span class="corner bottom">7<br>♦</span></span>

</div>

</section>
<section class="login" aria-label="Choose login method">

</section>
</main>
<script>
// Choose a different one of 10 distinct fall animations each time a card loops.
(()=>{
 const cards=[...document.querySelectorAll('.play-card')];
 const lastEffect=new WeakMap();
 const randomize=card=>{
  let next=Math.floor(Math.random()*10);
  const previous=lastEffect.get(card);
  if(previous!==undefined){while(next===previous)next=Math.floor(Math.random()*10);}
  lastEffect.set(card,next);
  for(let i=0;i<10;i++)card.classList.remove('m'+i);
  card.classList.add('m'+next);
  card.style.setProperty('--duration',(6.5+Math.random()*4.5).toFixed(2)+'s');
 };
 cards.forEach(card=>{
  randomize(card);
  card.addEventListener('animationiteration',()=>randomize(card));
 });
})();
document.getElementById('facebookBtn').addEventListener('click',()=>alert('Facebook sign-in setup required: connect your Facebook OAuth app to enable login.'));
document.getElementById('googleBtn').addEventListener('click',()=>alert('Google sign-in setup required: connect your Google OAuth client to enable login.'));
document.getElementById('guestBtn').addEventListener('click',()=>alert('Guest session logic ko game ke saath connect karna baaki hai.'));

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=17',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}));
if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone){
 const lock=()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});};
 lock();window.addEventListener('load',lock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});
}
</script>
