<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160020">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Teen Patti Diamond | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Manrope,sans-serif;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:pan-x}
body{height:100dvh;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 35% 45%,#7b00c6 0%,#31004e 52%,#100019 100%);display:flex;align-items:center;justify-content:center;padding:24px}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #e6a9ff28;border-radius:50%;width:70vw;height:70vw;max-width:850px;max-height:850px}body:after{box-shadow:0 0 80px #8b26d522 inset}.sparkle{position:fixed;pointer-events:none;color:#ffe49a;text-shadow:0 0 12px #ffcc55;opacity:.75;z-index:0}.sparkle.one{left:7%;top:18%;font-size:20px}.sparkle.two{right:8%;top:24%;font-size:14px}.sparkle.three{right:45%;bottom:12%;font-size:18px}.top-tools{position:fixed;z-index:5;right:18px;top:14px;display:flex;gap:9px}.tool-btn{width:38px;height:38px;border-radius:50%;border:1px solid #ffd77a66;background:#2d0645aa;color:#ffe6a2;display:grid;place-items:center;font-size:19px;cursor:pointer;backdrop-filter:blur(8px)}
body:before{left:-30vw;top:-38vw}body:after{right:-35vw;bottom:-40vw}
.page{position:relative;z-index:1;width:min(1380px,100%);height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"login art";gap:clamp(20px,4vw,60px);align-items:center;margin:auto}
.art{grid-area:art;min-width:0;height:100%;max-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}.art:before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:7%;height:18%;background:radial-gradient(ellipse,#ffca5d75 0%,#a72bff38 38%,transparent 73%);filter:blur(14px)}.art:after{content:"";position:absolute;z-index:-1;left:12%;right:12%;bottom:5%;height:2px;background:linear-gradient(90deg,transparent,#ffd36d,#fff0b1,#ffd36d,transparent);box-shadow:0 0 20px 7px #ffb52d44;border-radius:50%}
.character{display:block;width:min(125%,900px);height:88dvh;max-height:88dvh;min-height:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 30px #d54affaa) drop-shadow(0 14px 12px #160020aa);margin:0 0 -18px;flex:0 1 auto;user-select:none;-webkit-user-drag:none;pointer-events:none}

.login{grid-area:login;width:100%;max-width:520px;margin:auto;text-align:center;padding:20px 8px;background:transparent;border:0;box-shadow:none}
.offer{font:700 clamp(22px,3vw,32px) Cinzel,serif;color:#ffe4a0;text-shadow:0 2px 12px #ffb52d66;margin:0 0 24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:12px 22px;border:1px solid #ffd77a55;border-radius:999px;background:linear-gradient(110deg,#260039cc,#5a1478aa,#260039cc);box-shadow:inset 0 1px 0 #fff5c044,0 8px 22px #16002066}.offer:before{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}.offer:after{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}
.action{width:100%;max-width:390px;min-height:58px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;cursor:pointer;font:800 20px Manrope;line-height:1.1;transition:transform .15s,filter .15s;padding:8px 16px;text-align:center;border:1px solid #ffffff45;position:relative;overflow:hidden}
.action:active{transform:translateY(2px) scale(.985);filter:brightness(1.12)}.clay:before{content:"";position:absolute;inset:3px;border-radius:18px;border:1px solid #ffffff20;pointer-events:none}
.facebook{color:#fff;background:linear-gradient(145deg,#75b8ff 0%,#347fda 48%,#174c9b 100%);border:1px solid #c4e2ff;box-shadow:8px 8px 18px #12002088,-7px -7px 18px #ffffff18,inset 2px 2px 5px #ffffff77,inset -3px -3px 7px #092b66}
.social-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;font-weight:900;font-family:Arial,sans-serif;font-size:34px;line-height:1;box-shadow:inset 2px 2px 5px #ffffff77,inset -3px -3px 7px #0005,5px 5px 12px #0005}.facebook-mark{background:linear-gradient(145deg,#fff,#dceaff);color:#1877f2;text-shadow:0 1px 1px #fff}.google-mark{font-size:30px;background:linear-gradient(145deg,#fff,#e8e8e8);color:#4285f4;text-shadow:1px 1px #fbbc05}
.guest{max-width:390px;min-height:58px;margin:0 auto;color:#fff;background:linear-gradient(145deg,#424b59,#151a25 70%);border:1px solid #a9b4c455;box-shadow:8px 8px 18px #12002099,-6px -6px 18px #ffffff14,inset 2px 2px 5px #ffffff30,inset -3px -3px 7px #0009}
.usericon{font-size:0;width:31px;height:31px;position:relative;margin-right:12px}.usericon:before{content:"";position:absolute;top:0;left:10px;width:12px;height:12px;border-radius:50%;background:#e9edf4}.usericon:after{content:"";position:absolute;left:4px;bottom:0;width:24px;height:17px;border-radius:14px 14px 5px 5px;background:#e9edf4}
.google{color:#fff;background:linear-gradient(145deg,#653c85,#32134f 60%,#210936);border:1px solid #d9b8ff66;box-shadow:8px 8px 18px #12002099,-6px -6px 18px #ffffff14,inset 2px 2px 5px #ffffff35,inset -3px -3px 7px #0008}.legal{font-size:10px;color:#d9b7ed;line-height:1.7;margin:7px 0 0}.legal a{color:#ffe2a0;text-decoration:underline;text-underline-offset:2px}.note{font-size:11px;color:#d9b7ed;line-height:1.6;margin-top:12px}
@media(max-width:700px) and (orientation:portrait){body{padding:8px 14px}.page{height:100%;grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-template-areas:"art" "login";gap:0;max-width:460px}.art{height:100%;max-height:42dvh;gap:0}.character{height:31dvh;max-height:31dvh;width:115%;max-width:390px}.brand{font-size:clamp(25px,7vw,34px);margin:0}.diamond{font-size:15px;padding:4px 18px}.login{padding:8px 5px}.offer{font-size:18px;margin-bottom:8px;padding:8px 14px}.action{min-height:50px;max-width:310px;font-size:17px;margin-bottom:9px}.ficon{font-size:40px}.guest{min-height:50px;margin-top:0}.note{margin-top:6px}.legal{font-size:9px;margin-top:3px}.top-tools{top:8px;right:8px}}
@media(orientation:landscape){body{padding:0 3vw}.page{grid-template-columns:.95fr 1.05fr;grid-template-areas:"login art";gap:2vw;max-width:1380px}.character{height:88dvh;max-height:88dvh;width:125%;max-width:900px;margin:0}.brand{font-size:clamp(30px,4.2vw,56px)}.diamond{font-size:clamp(16px,1.9vw,23px);padding:5px 20px}.offer{font-size:clamp(20px,2.2vw,29px);margin-bottom:18px}.action{min-height:58px;max-width:390px;margin-bottom:12px;font-size:20px}.ficon{font-size:42px}.guest{min-height:66px;margin-top:0}.note{margin-top:10px}}
</style>
</head>
<body>
<main class="page">
<section class="art" aria-label="Teen Patti Diamond character">
<img class="character" src="./bg-diamond.png" alt="Teen Patti Diamond character">

</section>
<section class="login" aria-label="Choose login method">
<h2 class="offer">1,20,000 Chips Free!</h2>
<button class="action facebook clay" id="facebookBtn" type="button" aria-label="Continue with Facebook"><span class="social-icon facebook-mark" aria-hidden="true">f</span></button>
<button class="action google clay" id="googleBtn" type="button" aria-label="Continue with Google"><span class="social-icon google-mark" aria-hidden="true">G</span></button>
<button class="action guest clay" id="guestBtn" type="button"><span class="usericon" aria-hidden="true"></span><span>Guest</span></button>
<p class="note">Play for fun. No real-money play or cash prizes.</p><p class="legal">By logging in, you agree to our <a href="./terms.html">Terms</a> &amp; <a href="./privacy.html">Privacy Policy</a>.</p>
</section>
</main>
<script>
document.getElementById('facebookBtn').addEventListener('click',()=>alert('Facebook sign-in setup required: connect your Facebook OAuth app to enable login.'));
document.getElementById('googleBtn').addEventListener('click',()=>alert('Google sign-in setup required: connect your Google OAuth client to enable login.'));
document.getElementById('guestBtn').addEventListener('click',()=>alert('Guest session logic ko game ke saath connect karna baaki hai.'));
const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));b.textContent=on?'♫̸':'♫';b.setAttribute('aria-label',on?'Sound muted':'Sound enabled');});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone){
 const lock=()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});};
 lock();window.addEventListener('load',lock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});
}
</script>
</body></html>
