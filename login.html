<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#210039">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Teen Patti Diamond | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Manrope:wght@500;700;800&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Manrope', sans-serif;
  color: #fff;
  background: #210039;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100svh;
  min-height: 100svh;
  background: radial-gradient(ellipse at 35% 45%, #7b00c6 0%, #31004e 52%, #100019 100%);
  display: flex;
  overflow: hidden;
  padding: 0;
}

/* Decorative background rings */
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  border: 1px solid #e6a9ff24;
  border-radius: 50%;
  width: 70vw;
  height: 70vw;
  max-width: 850px;
  max-height: 850px;
}
body::before { left: -30vw; top: -38vw; }
body::after { right: -35vw; bottom: -40vw; box-shadow: 0 0 80px #8b26d522 inset; }

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
  grid-template-areas: "login art";
  gap: clamp(10px, 2vw, 28px);
  align-items: center;
}

/* Character & Falling Cards Section */
.art {
  grid-area: art;
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transform: none;
  padding: 2svh 0 4svh;
}
.art::before {
  content: "";
  position: absolute;
  z-index: 0;
  left: 10%;
  right: 10%;
  bottom: 5%;
  height: 16%;
  background: radial-gradient(ellipse, #ffca5d85 0%, #a72bff44 42%, transparent 74%);
  filter: blur(14px);
}
.art::after {
  content: "";
  position: absolute;
  z-index: 0;
  left: 14%;
  right: 14%;
  bottom: 4%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ffd36d, #fff0b1, #ffd36d, transparent);
  box-shadow: 0 0 20px 7px #ffb52d44;
  border-radius: 50%;
}

 .character-stage {
  position: relative;
  z-index: 2;
  height: min(78svh, 700px);
  aspect-ratio: 2 / 3;
  max-width: 100%;
  margin: auto;
  transform-origin: center center;
  animation: none !important;
  transform: none !important;
}
@keyframes heroBreath {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.02) translateY(-3px); }
}

.character {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  /* Note: Agar bg-diamond.png transparent PNG hai toh mix-blend-mode hata dein */
  mix-blend-mode: lighten;
  filter: drop-shadow(0 0 24px #d54aff77) drop-shadow(0 12px 12px #160020aa);
  pointer-events: none;
  -webkit-user-drag: none;
}

/* Falling Cards */
 .card-sprinkle {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.play-card {
  position: absolute;
  top: -70px;
  width: clamp(26px, 3.2vw, 40px);
  height: clamp(39px, 4.8vw, 60px);
  border-radius: 5px;
  background: linear-gradient(145deg, #fff, #f2eee8);
  border: 1px solid #d7d0c8;
  box-shadow: 0 4px 10px #08000d77;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #151515;
  font-family: Georgia, serif;
  font-weight: 700;
  opacity: 0;
  will-change: transform, opacity;
  animation-duration: var(--duration, 8s);
  animation-delay: var(--delay, 0s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  pointer-events: none;
  backface-visibility: hidden;
}
.play-card.red { color: #d71935; }
.play-card .pip { font-size: clamp(15px, 1.8vw, 22px); line-height: 1; }
.play-card .corner { position: absolute; left: 4px; top: 3px; font-size: clamp(7px, 0.8vw, 9px); line-height: 0.95; text-align: center; }
.play-card .corner.bottom { left: auto; top: auto; right: 4px; bottom: 3px; transform: rotate(180deg); }

.play-card.c1 { left: 4%; } .play-card.c2 { left: 15%; } .play-card.c3 { left: 26%; }
.play-card.c4 { right: 26%; } .play-card.c5 { right: 15%; } .play-card.c6 { right: 4%; }
.play-card.c7 { left: 10%; } .play-card.c8 { right: 10%; } .play-card.c9 { left: 36%; } .play-card.c10 { right: 36%; }

@keyframes cardFall0 { 0% { transform: translate(-8vw, 0) rotate(-35deg) scale(.75); opacity: 0; } 12% { opacity: .88; } 88% { opacity: .88; } 100% { transform: translate(6vw, 112svh) rotate(220deg) scale(.85); opacity: 0; } }
@keyframes cardFall1 { 0% { transform: translate(8vw, 0) rotate(28deg) scale(1.05); opacity: 0; } 12% { opacity: .88; } 88% { opacity: .88; } 100% { transform: translate(-8vw, 112svh) rotate(-250deg) scale(.95); opacity: 0; } }
@keyframes cardFall2 { 0% { transform: translate(0, 0) rotate(0) scale(.7); opacity: 0; } 15% { opacity: .88; } 85% { opacity: .88; } 100% { transform: translate(4vw, 112svh) rotate(340deg) scale(.9); opacity: 0; } }
@keyframes cardFall3 { 0% { transform: translate(-6vw, 0) rotate(60deg) scale(.95); opacity: 0; } 12% { opacity: .88; } 88% { opacity: .88; } 100% { transform: translate(-10vw, 112svh) rotate(-300deg) scale(1.05); opacity: 0; } }
@keyframes cardFall4 { 0% { transform: translate(10vw, 0) rotate(-50deg) scale(.85); opacity: 0; } 12% { opacity: .88; } 88% { opacity: .88; } 100% { transform: translate(-6vw, 112svh) rotate(310deg) scale(.75); opacity: 0; } }
.play-card.m0 { animation-name: cardFall0; } .play-card.m1 { animation-name: cardFall1; }
.play-card.m2 { animation-name: cardFall2; } .play-card.m3 { animation-name: cardFall3; }
.play-card.m4 { animation-name: cardFall4; }

/* Login Section */
.login {
  grid-area: login;
  width: 100%;
  max-width: 500px;
  margin: auto;
  text-align: center;
  padding: clamp(8px, 1.5vh, 16px) 16px;
  position: relative;
  z-index: 3;
  min-width: 0;
}

.brand-logo {
  display: block;
  width: min(440px, 92%);
  max-height: min(195px, 29svh);
  height: auto;
  object-fit: contain;
  margin: 0 auto 10px;
  filter: drop-shadow(0 8px 18px #d94cff66);
  pointer-events: none;
  -webkit-user-drag: none;
}

.welcome-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  margin: 0 auto 16px;
  border-radius: 999px;
  border: 1px solid #ffd77a66;
  background: linear-gradient(110deg, #260039cc, #5a1478aa, #260039cc);
  color: #ffe4a0;
  font: 700 clamp(12px, 1.4vw, 15px) 'Cinzel', serif;
  letter-spacing: 0.4px;
  box-shadow: 0 4px 14px #16002088;
}

.social-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 0 auto 10px;
}

.social-btn, .guest-btn {
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.14s ease, filter 0.14s ease;
}
.social-btn:active, .guest-btn:active {
  transform: translateY(2px) scale(0.96);
  filter: brightness(1.1);
}
.clay::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: inherit;
  border: 1px solid #ffffff28;
  pointer-events: none;
}

.social-btn {
  width: 68px;
  height: 60px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff66;
}
.social-btn svg { width: 30px; height: 30px; }

.google {
  background: linear-gradient(145deg, #ffffff 0%, #fffdf8 72%, #f5e8c7 100%);
  box-shadow: 5px 6px 13px #080d2688, inset 2px 2px 5px #ffffff, inset -3px -3px 7px #d6c59a;
}
.facebook {
  color: #fff;
  background: linear-gradient(145deg, #66b4ff 0%, #1877f2 48%, #0755b8 100%);
  border-color: #a9d7ff;
  box-shadow: 5px 6px 13px #080d2688, inset 2px 2px 5px #ffffff88, inset -3px -3px 7px #003d8c;
}

.guest-btn {
  width: 174px;
  height: 52px;
  border-radius: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #fff;
  font: 700 17px 'Manrope', sans-serif;
  background: linear-gradient(145deg, #424b59, #151a25 70%);
  border: 1px solid #a9b4c455;
  box-shadow: 5px 5px 12px #10001899, inset 2px 2px 5px #ffffff30, inset -3px -3px 7px #0009;
}

.usericon { width: 22px; height: 22px; position: relative; }
.usericon::before { content: ""; position: absolute; top: 1px; left: 6px; width: 10px; height: 10px; border-radius: 50%; background: #e9edf4; }
.usericon::after { content: ""; position: absolute; left: 2px; bottom: 1px; width: 18px; height: 11px; border-radius: 10px 10px 4px 4px; background: #e9edf4; }

.note { font-size: 11px; color: #d9b7ed; margin: 8px 0 4px; }
.legal { font-size: 10px; color: #d9b7ed; margin: 0; }
.legal a { color: #ffe2a0; text-decoration: underline; text-underline-offset: 2px; }

/* Responsive phone layout: centered character + centered login controls */
@media (orientation: portrait) and (max-width: 900px) {
  .page {
    width: 100%;
    height: 100%;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 40svh minmax(0, 60svh);
    grid-template-areas: "art" "login";
    max-width: 560px;
    margin: 0 auto;
    gap: 0;
    align-items: stretch;
  }
  .art {
    width: 100%;
    height: 100%;
    min-height: 0;
    transform: none;
    align-items: center;
    justify-content: center;
  }
  .character-stage {
    height: 100%;
    max-height: 40svh;
    width: auto;
    max-width: 100%;
    aspect-ratio: 2 / 3;
  }
  .login {
    width: 100%;
    height: 100%;
    max-width: 100%;
    min-height: 0;
    margin: 0 auto;
    padding: clamp(6px, 1.2svh, 14px) 14px max(8px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 0.8svh, 10px);
    text-align: center;
  }
  .brand-logo {
    width: min(330px, 78vw);
    max-height: min(16svh, 150px);
    height: auto;
    margin: 0 auto;
    object-fit: contain;
  }
  .welcome-pill {
    margin: 0 auto;
    padding: 5px 14px;
    font-size: clamp(11px, 2.8vw, 15px);
  }
  .social-row {
    width: 100%;
    justify-content: center;
    gap: 16px;
    margin: 0 auto;
  }
  .social-btn {
    width: clamp(54px, 9svh, 68px);
    height: clamp(48px, 8svh, 60px);
  }
  .guest-btn {
    width: clamp(150px, 27svw, 174px);
    height: clamp(44px, 7.2svh, 52px);
    margin: 0 auto;
    font-size: clamp(15px, 3.4vw, 17px);
  }
  .note {
    margin: 0;
    font-size: clamp(9px, 2.3vw, 11px);
    line-height: 1.3;
  }
  .legal {
    margin: 0;
    font-size: clamp(8px, 2vw, 10px);
    line-height: 1.3;
  }
}

/* Short portrait phones: compress spacing without shrinking the main buttons too far. */
@media (orientation: portrait) and (max-width: 430px) and (max-height: 760px) {
  .page { grid-template-rows: 36svh minmax(0, 64svh); }
  .character-stage { max-height: 36svh; }
  .brand-logo { max-height: 13svh; width: min(290px, 74vw); }
  .login { gap: 4px; padding-top: 4px; }
  .welcome-pill { padding: 4px 11px; }
  .social-btn { width: 54px; height: 48px; }
  .guest-btn { height: 44px; }
}

/* Wide landscape phones keep the original side-by-side composition. */
@media (orientation: landscape) and (max-height: 520px) {
  .page { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); }
  .art { transform: none; }
  .login { padding-left: 6px; padding-right: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .character-stage, .play-card { animation: none !important; }
}

/* Keep login controls at their original size when Android system bars appear/disappear. */
@media (max-width: 700px) and (orientation: landscape) {
  .page { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); }
  .art { transform: none; }
  .login { padding-left: 6px; padding-right: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .character-stage, .play-card { animation: none !important; }
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
</head>
<body>
<main class="page">
  <section class="art" aria-label="Teen Patti Diamond character">
    <div class="character-stage">
      <img class="character" src="./bg-diamond.png" alt="Teen Patti Diamond character">
    </div>
    <div class="card-sprinkle" aria-hidden="true">
      <span class="play-card c1"><span class="corner">2<br>♠</span><span class="pip">♠</span><span class="corner bottom">2<br>♠</span></span>
      <span class="play-card red c2"><span class="corner">3<br>♥</span><span class="pip">♥</span><span class="corner bottom">3<br>♥</span></span>
      <span class="play-card red c3"><span class="corner">4<br>♦</span><span class="pip">♦</span><span class="corner bottom">4<br>♦</span></span>
      <span class="play-card c4"><span class="corner">5<br>♣</span><span class="pip">♣</span><span class="corner bottom">5<br>♣</span></span>
      <span class="play-card c5"><span class="corner">6<br>♠</span><span class="pip">♠</span><span class="corner bottom">6<br>♠</span></span>
      <span class="play-card red c6"><span class="corner">7<br>♦</span><span class="pip">♦</span><span class="corner bottom">7<br>♦</span></span>
      <span class="play-card red c7"><span class="corner">8<br>♥</span><span class="pip">♥</span><span class="corner bottom">8<br>♥</span></span>
      <span class="play-card c8"><span class="corner">9<br>♣</span><span class="pip">♣</span><span class="corner bottom">9<br>♣</span></span>
      <span class="play-card c9"><span class="corner">10<br>♠</span><span class="pip">♠</span><span class="corner bottom">10<br>♠</span></span>
      <span class="play-card red c10"><span class="corner">A<br>♥</span><span class="pip">♥</span><span class="corner bottom">A<br>♥</span></span>
    </div>
  </section>

  <section class="login" aria-label="Choose login method">
    <img class="brand-logo" src="./teen-patti-diamond-logo.png" alt="Teen Patti Diamond logo" fetchpriority="high">

    <div class="social-row">
      <button class="social-btn google clay" id="googleBtn" type="button" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15z"/><path fill="#FF3D00" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/><path fill="#4CAF50" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8z"/><path fill="#1976D2" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12z"/></svg>
      </button>
      <button class="social-btn facebook clay" id="facebookBtn" type="button" aria-label="Continue with Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.3-1.5 1.6-1.5h1.7V3.7c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2H7.3V13h2.8v8z"/></svg>
      </button>
    </div>

    <button class="guest-btn clay" id="guestBtn" type="button">
      <span class="usericon" aria-hidden="true"></span>
      <span>Guest</span>
    </button>

    <p class="note">Play for fun. No real-money play or cash prizes.</p>
    <p class="legal">By logging in, you agree to our <a href="./terms.html">Terms</a> &amp; <a href="./privacy.html">Privacy Policy</a>.</p>
  </section>
</main>

<script>
// Animate decorative playing cards in the background; character remains stationary.
(() => {
  const cards = [...document.querySelectorAll('.play-card')];
  const lastEffect = new WeakMap();
  const randomize = (card, isFirst = false) => {
    let next = Math.floor(Math.random() * 5);
    const prev = lastEffect.get(card);
    if (prev !== undefined && next === prev) next = (next + 1) % 5;
    lastEffect.set(card, next);
    card.classList.remove('m0', 'm1', 'm2', 'm3', 'm4');
    card.classList.add('m' + next);
    const dur = (7 + Math.random() * 4).toFixed(2);
    card.style.setProperty('--duration', dur + 's');
    card.style.setProperty('--delay', isFirst ? (-Math.random() * dur).toFixed(2) + 's' : '0s');
  };
  cards.forEach(card => {
    randomize(card, true);
    card.addEventListener('animationiteration', () => randomize(card, false));
  });
})();

// Supabase authentication for Google, Facebook and anonymous guest play.
const TPD_CONFIG = window.TPD_SUPABASE_CONFIG || {};
const TPD_CONFIG_READY = !!(TPD_CONFIG.url && TPD_CONFIG.publishableKey &&
  !String(TPD_CONFIG.url).includes('YOUR_') &&
  !String(TPD_CONFIG.publishableKey).includes('YOUR_'));
const TPD_AUTH = TPD_CONFIG_READY && window.supabase
  ? window.supabase.createClient(TPD_CONFIG.url, TPD_CONFIG.publishableKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;
const TPD_LOBBY_URL = new URL('./lobby.html?v=34', window.location.href).href;

function showAuthError(error) {
  console.error('Teen Patti Diamond sign-in error:', error);
  alert(error?.message || 'Sign-in could not start. Please try again.');
}

async function startOAuth(provider) {
  if (!TPD_AUTH) {
    alert('Login setup is incomplete. Please try again later.');
    return;
  }
  const { error } = await TPD_AUTH.auth.signInWithOAuth({
    provider,
    options: { redirectTo: TPD_LOBBY_URL }
  });
  if (error) showAuthError(error);
}

document.getElementById('googleBtn').addEventListener('click', () => startOAuth('google'));
document.getElementById('facebookBtn').addEventListener('click', () => startOAuth('facebook'));

document.getElementById('guestBtn').addEventListener('click', async () => {
  if (!TPD_AUTH) {
    alert('Login setup is incomplete. Please try again later.');
    return;
  }
  const button = document.getElementById('guestBtn');
  button.disabled = true;
  try {
    const { data, error } = await TPD_AUTH.auth.signInAnonymously();
    if (error) throw error;
    if (data.session) window.location.replace(TPD_LOBBY_URL);
    else throw new Error('Guest session was not created. Please try again.');
  } catch (error) {
    showAuthError(error);
    button.disabled = false;
  }
});

// If the player already has a Supabase session, continue to the lobby.
(async () => {
  if (!TPD_AUTH) return;
  const { data, error } = await TPD_AUTH.auth.getSession();
  if (!error && data.session) window.location.replace(TPD_LOBBY_URL);
})();

// Lock landscape when installed as PWA / App
if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.navigator.standalone) {
  const lock = () => {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  };
  lock();
  window.addEventListener('load', lock);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
}

// Single clean Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js?v=34', { updateViaCache: 'none' });
      await reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    } catch (err) {
      console.warn('SW registration failed', err);
    }
  });
}
</script>
</body>
</html>
