<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160020">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Teen Patti Diamond | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:Manrope,sans-serif;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:pan-x}
body{height:100dvh;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 35% 45%,#7b00c6 0%,#31004e 52%,#100019 100%);display:flex;align-items:center;justify-content:center;padding:24px}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid #e6a9ff28;border-radius:50%;width:70vw;height:70vw;max-width:850px;max-height:850px}body:after{box-shadow:0 0 80px #8b26d522 inset}.sparkle{position:fixed;pointer-events:none;color:#ffe49a;text-shadow:0 0 12px #ffcc55;opacity:.75;z-index:0}.sparkle.one{left:7%;top:18%;font-size:20px}.sparkle.two{right:8%;top:24%;font-size:14px}.sparkle.three{right:45%;bottom:12%;font-size:18px}.top-tools{position:fixed;z-index:5;right:18px;top:14px;display:flex;gap:9px}.tool-btn{width:38px;height:38px;border-radius:50%;border:1px solid #ffd77a66;background:#2d0645aa;color:#ffe6a2;display:grid;place-items:center;font-size:19px;cursor:pointer;backdrop-filter:blur(8px)}
body:before{left:-30vw;top:-38vw}body:after{right:-35vw;bottom:-40vw}
.page{position:relative;z-index:1;width:min(1380px,100%);height:100%;display:grid;grid-template-columns:.95fr 1.05fr;grid-template-areas:"login art";gap:clamp(20px,4vw,60px);align-items:center;margin:auto}
.art{grid-area:art;min-width:0;height:100%;max-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}.art:before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:7%;height:18%;background:radial-gradient(ellipse,#ffca5d75 0%,#a72bff38 38%,transparent 73%);filter:blur(14px)}.art:after{content:"";position:absolute;z-index:-1;left:12%;right:12%;bottom:5%;height:2px;background:linear-gradient(90deg,transparent,#ffd36d,#fff0b1,#ffd36d,transparent);box-shadow:0 0 20px 7px #ffb52d44;border-radius:50%}
.character{display:block;width:min(112%,790px);height:70dvh;max-height:70dvh;min-height:0;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 30px #d54affaa) drop-shadow(0 14px 12px #160020aa);margin:0 0 -18px;flex:0 1 auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.brand{font:800 clamp(32px,4.5vw,58px)/1.02 Cinzel,serif;letter-spacing:1px;color:#fff0a0;background:linear-gradient(180deg,#fff9cb 5%,#ffd45a 42%,#d98719 72%,#fff0a8 92%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #6b2c00) drop-shadow(0 0 16px #ffb52d99);margin:0 0 4px;position:relative;flex:0 0 auto}
.diamond{font:700 clamp(16px,2vw,24px) Cinzel,serif;letter-spacing:7px;color:#fff0ce;text-shadow:0 0 18px #d15aff;padding:4px 18px;margin-bottom:2px;flex:0 0 auto;display:flex;align-items:center;gap:13px}.diamond:before,.diamond:after{content:"";width:13px;height:13px;display:inline-block;transform:rotate(45deg);background:linear-gradient(135deg,#fff4b0,#d94cff 55%,#6b16c7);border:1px solid #ffe18b;box-shadow:0 0 12px #d64dff}
.login{grid-area:login;width:100%;max-width:520px;margin:auto;text-align:center;padding:20px 8px;background:transparent;border:0;box-shadow:none}
.offer{font:700 clamp(22px,3vw,32px) Cinzel,serif;color:#ffe4a0;text-shadow:0 2px 12px #ffb52d66;margin:0 0 24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:12px 22px;border:1px solid #ffd77a55;border-radius:999px;background:linear-gradient(110deg,#260039cc,#5a1478aa,#260039cc);box-shadow:inset 0 1px 0 #fff5c044,0 8px 22px #16002066}.offer:before{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}.offer:after{content:"✦";font-size:25px;color:#ffda67;text-shadow:0 0 12px #ffb52d}
.action{width:100%;max-width:none;min-height:72px;border-radius:18px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;justify-items:center;margin:0 auto 14px;cursor:pointer;font:800 clamp(18px,2.1vw,24px) Manrope;line-height:1.15;transition:transform .15s,filter .15s;padding:8px 16px;text-align:center;border:1px solid rgba(255,215,0,.35)}
.action:active{transform:translateY(2px) scale(.99);filter:brightness(1.12)}
.facebook{color:white;border:1px solid rgba(255,215,0,.35);background:linear-gradient(180deg,#68a8ff 0%,#2871ce 48%,#17488f 100%);box-shadow:inset 0 3px 5px #ffffff8c,inset 0 -4px 0 #123b79,0 5px 0 #0c2c62,0 11px 22px #0007}
.ficon{font:900 58px Arial,sans-serif;line-height:1;grid-column:1;color:#fff;text-shadow:0 2px 1px #17417e}.ficon svg{display:block;width:34px;height:34px}.facebook span:last-child{grid-column:2/4;justify-self:center}
.guest{max-width:none;min-height:72px;margin:0 auto;color:#fff;border:1px solid rgba(255,215,0,.35);background:linear-gradient(180deg,#303a47 0%,#151b24 50%,#070a10 100%);box-shadow:inset 0 3px 6px #ffffff35,inset 0 -4px 0 #05070a,0 5px 0 #030508,0 12px 22px #0008}
.usericon{font-size:0;grid-column:1;justify-self:center;width:43px;height:43px;position:relative}.usericon:before{content:"";position:absolute;top:0;left:13px;width:18px;height:18px;border-radius:50%;background:#e9edf4}.usericon:after{content:"";position:absolute;left:5px;bottom:0;width:34px;height:22px;border-radius:18px 18px 7px 7px;background:#e9edf4}.guest span:last-child{grid-column:2/4;justify-self:center}.google span:last-child{grid-column:2/4;justify-self:center}
.google{color:#fff;border:1px solid rgba(255,215,0,.35);background:linear-gradient(180deg,#5b347c,#32134f 58%,#210936);box-shadow:inset 0 2px 5px #ffffff38,0 5px 0 #180629,0 10px 20px #0006}.gicon{grid-column:1;width:30px;height:30px}.legal{font-size:10px;color:#d9b7ed;line-height:1.7;margin:7px 0 0}.legal a{color:#ffe2a0;text-decoration:underline;text-underline-offset:2px}.note{font-size:11px;color:#d9b7ed;line-height:1.6;margin-top:12px}
@media(max-width:700px) and (orientation:portrait){body{padding:8px 14px}.page{height:100%;grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-template-areas:"art" "login";gap:0;max-width:460px}.art{height:100%;max-height:42dvh;gap:0}.character{height:24dvh;max-height:24dvh;width:100%;max-width:340px}.brand{font-size:clamp(25px,7vw,34px);margin:0}.diamond{font-size:15px;padding:4px 18px}.login{padding:8px 5px}.offer{font-size:18px;margin-bottom:8px;padding:8px 14px}.action{min-height:52px;font-size:16px;margin-bottom:8px}.ficon{font-size:40px}.guest{min-height:52px;margin-top:0}.note{margin-top:6px}.legal{font-size:9px;margin-top:3px}.top-tools{top:8px;right:8px}}
@media(orientation:landscape){body{padding:0 3vw}.page{grid-template-columns:.95fr 1.05fr;grid-template-areas:"login art";gap:2vw;max-width:1380px}.character{height:70dvh;max-height:70dvh;width:112%;max-width:790px;margin:0 0 -18px}.brand{font-size:clamp(30px,4.2vw,56px)}.diamond{font-size:clamp(16px,1.9vw,23px);padding:5px 20px}.offer{font-size:clamp(20px,2.2vw,29px);margin-bottom:18px}.action{min-height:66px;margin-bottom:12px;font-size:clamp(18px,2vw,24px)}.ficon{font-size:42px}.guest{min-height:66px;margin-top:0}.note{margin-top:10px}}
</style>
</head>
<body>
<main class="page">
<section class="art" aria-label="Teen Patti Diamond">
<img class="character" src="./bg-diamond.png" alt="Teen Patti Diamond character">
<h1 class="brand">TEEN PATTI</h1>
<div class="diamond">DIAMOND</div>
</section>
<section class="login" aria-label="Choose login method">
<h2 class="offer">1,20,000 Chips Free!</h2>
<button class="action facebook" id="facebookBtn" type="button"><span class="ficon" aria-hidden="true"><svg viewBox="0 0 24 24" width="42" height="42" role="img" aria-label="Facebook"><path fill="currentColor" d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.3-1.5 1.6-1.5h1.7V3.7c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2H7.3V13h2.8v8z"/></svg></span><span>Login using<br><strong>Facebook</strong></span></button>
<button class="action google" id="googleBtn" type="button"><span class="gicon" aria-hidden="true"><svg viewBox="0 0 48 48" width="30" height="30"><path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15z"/><path fill="#FF3D00" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/><path fill="#4CAF50" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8z"/><path fill="#1976D2" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12z"/></svg></span><span>Continue with Google</span></button>\n<button class="action guest" id="guestBtn" type="button"><span class="usericon" aria-hidden="true"></span><span>Guest</span></button>
<p class="note">Play for fun. No real-money play or cash prizes.</p><p class="legal">By logging in, you agree to our <a href="./terms.html">Terms</a> &amp; <a href="./privacy.html">Privacy Policy</a>.</p>
</section>
</main>
<script>
document.getElementById('facebookBtn').addEventListener('click',()=>alert('Facebook sign-in setup required: connect your Facebook OAuth app to enable login.'));\ndocument.getElementById('googleBtn').addEventListener('click',()=>alert('Google sign-in setup required: connect your Google OAuth client to enable login.'));
document.getElementById('guestBtn').addEventListener('click',()=>alert('Guest session logic ko game ke saath connect karna baaki hai.'));\ndocument.getElementById('supportBtn').addEventListener('click',()=>alert('Support details abhi configure nahi hain.'));\ndocument.getElementById('soundBtn').addEventListener('click',e=>{const b=e.currentTarget;const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));b.textContent=on?'♫̸':'♫';b.setAttribute('aria-label',on?'Sound muted':'Sound enabled');});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||window.navigator.standalone){
 const lock=()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});};
 lock();window.addEventListener('load',lock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});
}
</script>
</body></html>
