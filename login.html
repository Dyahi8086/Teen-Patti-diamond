<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#260044">
<title>Teen Patti Diamond | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:Manrope,sans-serif;color:#fff}
body{min-height:100svh;display:flex;align-items:center;justify-content:flex-end;padding:clamp(12px,3vw,42px);overflow-x:hidden;background:radial-gradient(ellipse at 25% 45%,#8b00cf 0%,#39005f 48%,#160023 100%)}
.character{position:fixed;z-index:0;left:1.5%;bottom:0;height:min(96svh,980px);width:min(54vw,720px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 24px #cf5aff88);pointer-events:none}
.wrap{position:relative;z-index:1;width:min(100%,430px);margin-right:clamp(0px,2vw,28px)}
.login{position:relative;padding:clamp(22px,3vw,32px);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(130,33,184,.22) 35%,rgba(40,0,68,.78));border:1px solid rgba(255,225,153,.85);box-shadow:inset 5px 5px 14px rgba(255,255,255,.18),inset -7px -8px 18px rgba(17,0,35,.42),0 18px 45px rgba(10,0,22,.55),0 0 30px rgba(215,90,255,.32);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px)}
.login:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,224,151,.38);border-radius:23px;pointer-events:none}
.head{text-align:center;margin:0 0 22px}
h1{font:800 27px Cinzel,serif;color:#ffe5a0;text-shadow:0 2px 12px #ffb62d55;margin:0 0 6px}
.sub{font-size:12px;color:#f0d9ff;margin:0}
.field{display:block;margin:0 0 13px}
.field span{display:block;margin:0 0 7px 4px;font-size:10px;font-weight:800;letter-spacing:1.1px;color:#ffe8bf;text-transform:uppercase}
.field input{width:100%;height:48px;border:1px solid rgba(255,222,153,.72);border-radius:15px;padding:0 15px;background:linear-gradient(145deg,rgba(30,0,48,.72),rgba(91,0,130,.42));box-shadow:inset 4px 4px 10px rgba(0,0,0,.28),inset -2px -2px 7px rgba(255,255,255,.08);color:#fff;font:600 13px Manrope;outline:none}
.field input::placeholder{color:#d1b2e0}
.field input:focus{border-color:#fff0b5;box-shadow:0 0 0 3px #ffd66b24,inset 3px 3px 8px #0004}
button{width:100%;height:48px;border-radius:15px;font:800 13px Manrope;cursor:pointer;transition:transform .15s,filter .15s}
button:active{transform:translateY(2px) scale(.99);filter:brightness(1.12)}
.primary{margin-top:4px;border:1px solid #fff0b0;color:#4a1d00;background:linear-gradient(145deg,#fff1b5,#ffd05d 48%,#d98519);box-shadow:inset 3px 3px 8px #ffffffa8,inset -4px -4px 8px #a64d1666,0 6px 0 #7d390b,0 10px 22px #ffad3444}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 13px;color:#f0d7ff;font-size:9px;letter-spacing:2px}
.or:before,.or:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#e4b4ffb0)}.or:after{background:linear-gradient(90deg,#e4b4ffb0,transparent)}
.social{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;border:1px solid rgba(255,255,255,.62);color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(87,0,123,.48));box-shadow:inset 3px 3px 8px #ffffff25,inset -4px -4px 9px #16002566,0 7px 18px #15002255}
.fbmark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#2875e8;font:bold 18px Arial}
.guest{margin-top:10px;border:1px solid rgba(255,219,133,.9);color:#ffe8aa;background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(111,0,155,.48));box-shadow:inset 3px 3px 8px #ffffff20,inset -4px -4px 9px #16002555,0 7px 18px #15002255}
.terms{text-align:center;color:#f0d9fa;font-size:9px;line-height:1.6;margin:15px 0 0}
@media(orientation:landscape) and (max-height:600px){body{padding:10px 4vw}.character{height:96svh;width:55vw;left:0}.wrap{width:min(42vw,410px);margin-right:2vw}.login{padding:16px 22px;border-radius:23px}.head{margin-bottom:12px}h1{font-size:22px}.sub{font-size:10px}.field{margin-bottom:8px}.field span{font-size:9px;margin-bottom:4px}.field input,button{height:38px;border-radius:12px;font-size:11px}.or{margin:11px 0 8px;font-size:8px}.social{margin-top:7px}.guest{margin-top:7px}.terms{margin-top:9px;font-size:8px}}
@media(orientation:portrait){body{justify-content:center;padding:18px 14px}.character{height:56svh;width:100vw;left:0;bottom:auto;top:0;opacity:.30;object-position:center top}.wrap{width:min(100%,410px);margin:0}.login{background:linear-gradient(145deg,rgba(67,0,96,.90),rgba(25,0,45,.95));backdrop-filter:blur(12px)}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<img class="character" src="./lg-diamond.png" alt="Teen Patti Diamond character">
<main class="wrap"><section class="login" aria-label="Teen Patti Diamond login">
<header class="head"><h1>Welcome Back</h1><p class="sub">Enter the royal table and enjoy the game</p></header>
<form id="loginForm">
<label class="field"><span>Mobile number or email</span><input id="identity" type="text" autocomplete="username" placeholder="Enter mobile number or email" required></label>
<label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
<button class="primary" type="submit">LOGIN</button></form>
<div class="or">OR CONTINUE WITH</div>
<button class="social" id="facebookBtn" type="button"><span class="fbmark">f</span> Continue with Facebook</button>
<button class="guest" id="guestBtn" type="button">Continue as Guest</button>
<p class="terms">By continuing, you agree to the Terms of Service and Privacy Policy.</p>
</section></main>
<script>
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();alert('Connect your existing login API here.')});
document.getElementById('facebookBtn').addEventListener('click',()=>alert('Connect Facebook Login here.'));
document.getElementById('guestBtn').addEventListener('click',()=>alert('Connect guest-session logic here.'));
</script>
</body></html>
