<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#210039"><link rel="manifest" href="./manifest.json"><title>Teen Patti Diamond — Lobby</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;color:#fff}body{min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#7100b5,#31004e 55%,#13001f);padding:clamp(14px,3vw,32px);overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}.player{display:flex;align-items:center;gap:10px;padding:9px 15px;border:1px solid #d9a8ff66;background:#ffffff15;border-radius:24px;font-weight:700}.avatar{font-size:24px}.back{color:#fff;background:#3a1155;border:1px solid #b881d8;border-radius:16px;padding:12px 18px;cursor:pointer}
main{max-width:1000px;margin:auto;text-align:center}.logo{display:block;width:min(380px,65vw);max-height:180px;object-fit:contain;margin:0 auto 10px}.intro{color:#e9c9ff;margin:0 auto 20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:700px;margin:auto}.tile{border:1px solid #e4b6ff80;background:linear-gradient(145deg,#8324b9,#36004e);border-radius:24px;min-height:125px;color:white;box-shadow:inset 0 2px 4px #ffffff44,0 10px 24px #10001888;padding:18px;cursor:pointer;font:700 clamp(17px,2.7vw,23px) system-ui}.tile span{display:block;font-size:36px;margin-bottom:8px}.tile.primary{background:linear-gradient(145deg,#e9ac39,#a75a0e);color:#290a17;border-color:#ffedb1}.foot{font-size:12px;color:#d8b9e9;margin:22px 0}.dialog{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#090011bb;padding:20px}.dialog.show{display:flex}.modal{max-width:400px;width:100%;background:linear-gradient(145deg,#5e1786,#220036);border:1px solid #d8a5ff;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 80px #0009}.modal button{padding:12px 24px;border:0;border-radius:12px;background:#e7b453;color:#29112d;font-weight:800;cursor:pointer}
@media(max-width:500px){.cards{gap:10px}.tile{min-height:110px;padding:12px}.tile span{font-size:30px}.player{padding:8px 10px;font-size:13px}}
</style></head><body><header><div class="player"><span class="avatar">👤</span><span id="playerName">Guest</span></div><button class="back" id="logout">Log out</button></header>
<main><img class="logo" src="./teen-patti-diamond-logo.png" alt="Teen Patti Diamond"><p class="intro">Welcome to your game lobby</p><div class="cards">
<button class="tile primary" data-feature="Play Game"><span>🃏</span>Play Game</button>
<button class="tile" data-feature="Private Table"><span>♠️</span>Private Table</button>
<button class="tile" data-feature="Friends"><span>👥</span>Friends</button>
<button class="tile" data-feature="Profile"><span>👑</span>Profile</button>
</div><p class="foot">Just for fun • No real-money play or cash prizes</p></main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="modal"><h2 id="dialogTitle">Coming soon</h2><p id="dialogText">This feature is being built.</p><button id="closeDialog">OK</button></div></div>
<script>
let player;try{player=JSON.parse(localStorage.getItem('tpd_player')||'null')}catch(e){}
if(!player||!player.id){location.replace('./login.html?v=26')}else{document.getElementById('playerName').textContent=player.name||'Guest'}
document.getElementById('logout').onclick=()=>{localStorage.removeItem('tpd_player');location.replace('./login.html?v=26')};
document.querySelectorAll('[data-feature]').forEach(btn=>btn.onclick=()=>{const name=btn.dataset.feature;document.getElementById('dialogTitle').textContent=name;document.getElementById('dialogText').textContent=name+' is not ready yet. Next we will build this page.';document.getElementById('dialog').classList.add('show')});
document.getElementById('closeDialog').onclick=()=>document.getElementById('dialog').classList.remove('show');
document.getElementById('dialog').onclick=e=>{if(e.target.id==='dialog')e.currentTarget.classList.remove('show')};
</script></body></html>
