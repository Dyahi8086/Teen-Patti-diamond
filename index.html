<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Royal Dragon Table — PNG Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 50%, #071b3d 0%, #020817 65%, #000208 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .table-stage {
      position: relative;
      width: min(96vw, 430px);
      height: min(96dvh, 840px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .table-png-base {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.95));
    }

    .overlay-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16% 20%;
    }

    .card-mini {
      width: 44px;
      height: 62px;
      border-radius: 7px;
      background: linear-gradient(145deg, #ffffff 0%, #e5ecff 100%);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      border: 1.5px solid #cbd5e1;
      transition: transform 0.25s ease;
    }

    .card-mini:hover {
      transform: translateY(-5px) scale(1.06);
    }
  </style>
</head>
<body>
  <div class="table-stage" id="tableStage">
    <img src="Table_256.png" alt="Royal Dragon Table" class="table-png-base" />

    <div class="overlay-layer" id="tableOverlay">
      <div class="flex flex-col items-center gap-3" id="cardsContainer">
        <div class="flex gap-2" id="dealtCards">
          <div class="card-mini text-rose-600"><span>A</span><span>♥</span></div>
          <div class="card-mini text-slate-900"><span>K</span><span>♠</span></div>
          <div class="card-mini text-rose-600"><span>Q</span><span>♦</span></div>
        </div>
        <button onclick="dealRandomHand()" class="px-4 py-1.5 rounded-full text-[11px] font-bold tracking-wider uppercase text-amber-200 bg-gradient-to-r from-amber-600/90 via-yellow-500/90 to-amber-600/90 border border-amber-300/70 shadow-lg active:scale-95 transition">
          Deal Cards
        </button>
      </div>
    </div>
  </div>
    <script>
    const ranks = ['A', 'K', 'Q', 'J', '10', '9', '8'];
    const suits = [
      { sym: '♥', color: 'text-rose-600' },
      { sym: '♦', color: 'text-rose-600' },
      { sym: '♠', color: 'text-slate-900' },
      { sym: '♣', color: 'text-slate-900' }
    ];

    function dealRandomHand() {
      const container = document.getElementById('dealtCards');
      container.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const r = ranks[Math.floor(Math.random() * ranks.length)];
        const s = suits[Math.floor(Math.random() * suits.length)];
        const card = document.createElement('div');
        card.className = `card-mini ${s.color}`;
        card.style.transform = 'scale(0.7) rotate(-8deg)';
        card.innerHTML = `<span>${r}</span><span>${s.sym}</span>`;
        container.appendChild(card);
        requestAnimationFrame(() => {
          card.style.transform = 'scale(1) rotate(0deg)';
        });
      }
    }
  </script>
</body>
</html>
