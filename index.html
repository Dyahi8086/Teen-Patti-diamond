<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Royal Dragon Table — Vertical Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 50%, #061838 0%, #020817 65%, #000208 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Ambient Blue & Gold Nebula Smoke */
    .nebula-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 22%, rgba(0, 140, 255, 0.28) 0%, transparent 42%),
        radial-gradient(circle at 82% 20%, rgba(255, 166, 0, 0.18) 0%, transparent 38%),
        radial-gradient(circle at 15% 78%, rgba(0, 119, 255, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0, 162, 255, 0.26) 0%, transparent 45%);
      filter: blur(28px);
      animation: pulseMist 7s ease-in-out infinite alternate;
    }

    @keyframes pulseMist {
      0% { opacity: 0.75; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    /* Vertical Table Stage Container (9:16 Aspect Ratio Responsive) */
    .table-stage {
      position: relative;
      width: min(96vw, 430px);
      height: min(96dvh, 840px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG Dragon & Filigree Frame */
    .royal-frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.95));
    }

    /* Royal Blue Textured Felt Inner Area */
    .felt-surface {
      position: absolute;
      top: 13.5%;
      bottom: 13.5%;
      left: 17.5%;
      right: 17.5%;
      border-radius: 999px;
      overflow: hidden;
      z-index: 1;
      background:
        radial-gradient(ellipse at 50% 42%, #0e4da4 0%, #083275 48%, #041b47 85%, #020e29 100%);
      box-shadow:
        inset 0 0 38px rgba(0, 0, 0, 0.92),
        inset 0 0 14px rgba(0, 210, 255, 0.45),
        0 0 22px rgba(0, 185, 255, 0.65);
      border: 2.5px solid #4be1ff;
    }

    /* Procedural Velvet/Damask Pattern Canvas */
    #feltCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.34;
      mix-blend-mode: overlay;
    }

    /* Glowing Cyan Inner Rim Line */
    .neon-inner-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 2px solid rgba(115, 240, 255, 0.9);
      box-shadow:
        inset 0 0 14px rgba(0, 217, 255, 0.8),
        0 0 16px rgba(0, 195, 255, 0.85);
      pointer-events: none;
    }

    /* 6 Glowing Blue Orb Gem Seats on Wooden Track */
    .gem-orb {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      z-index: 4;
      background: radial-gradient(circle at 35% 30%, #b8faff 0%, #19c3ff 35%, #0059d6 78%, #002366 100%);
      border: 2px solid #f7c348;
      box-shadow:
        0 0 14px rgba(0, 217, 255, 0.95),
        0 3px 6px rgba(0, 0, 0, 0.85),
        inset 0 2px 4px rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gem-orb::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 6px;
      width: 9px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      transform: rotate(-25deg);
    }

    .gem-orb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 22px #5ef2ff, 0 0 8px #ffd700;
    }

    /* Gem Positions Matching Reference */
    .gem-tl { top: 13.5%; left: 22.5%; }
    .gem-tr { top: 13.5%; right: 22.5%; }
    .gem-ml { top: 27.5%; left: 11.2%; }
    .gem-mr { top: 27.5%; right: 11.2%; }
    .gem-bl { bottom: 27.5%; left: 11.2%; }
    .gem-br { bottom: 27.5%; right: 11.2%; }
    .gem-bbl { bottom: 13.5%; left: 22.5%; }
    .gem-bbr { bottom: 13.5%; right: 22.5%; }

    /* Interactive Card Slots Layer inside Table */
    .game-content-layer {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 14px;
    }

    .card-mini {
      width: 44px;
      height: 62px;
      border-radius: 7px;
      background: linear-gradient(145deg, #ffffff 0%, #e5ecff 100%);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      border: 1.5px solid #cbd5e1;
      transition: transform 0.25s ease;
    }

    .card-mini:hover {
      transform: translateY(-5px) scale(1.06);
    }

    .pulse-flare {
      animation: flareGlow 2.4s ease-in-out infinite alternate;
    }

    @keyframes flareGlow {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="nebula-layer"></div>

  <div class="table-stage" id="tableStage">
    <!-- 1. Royal Blue Textured Felt Center -->
    <div class="felt-surface">
      <canvas id="feltCanvas"></canvas>
      <div class="neon-inner-ring"></div>

      <!-- Optional Interactive Card Demo Layer (Click "Toggle Cards" or tap felt to test) -->
      <div class="game-content-layer" id="tableOverlay">
        <div class="text-center mt-2">
          <span class="px-3 py-0.5 rounded-full text-[10px] tracking-widest uppercase font-bold text-cyan-200 bg-blue-950/70 border border-cyan-400/40 shadow">
            Royal Table
          </span>
        </div>

        <!-- Center Cards Area -->
        <div class="flex flex-col items-center gap-3 my-auto" id="cardsContainer">
          <div class="flex gap-2" id="dealtCards">
            <div class="card-mini text-rose-600"><span>A</span><span>♥</span></div>
            <div class="card-mini text-slate-900"><span>K</span><span>♠</span></div>
            <div class="card-mini text-rose-600"><span>Q</span><span>♦</span></div>
          </div>
          <button onclick="dealRandomHand()" class="px-3.5 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase text-amber-200 bg-gradient-to-r from-amber-600/80 via-yellow-500/80 to-amber-600/80 border border-amber-300/70 shadow-lg active:scale-95 transition">
            Deal Cards
          </button>
        </div>

        <div class="mb-2 text-[10px] tracking-widest uppercase text-cyan-300/70 font-semibold">
          Tap Orbs to Seat
        </div>
      </div>
    </div>

    <!-- 2. 8 Glowing Cyan Orb Gems Around Wooden Track -->
    <div class="gem-orb gem-tl" title="Seat 1" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-tr" title="Seat 2" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-ml" title="Seat 3" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-mr" title="Seat 4" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-bl" title="Seat 5" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-br" title="Seat 6" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-bbl" title="Seat 7" onclick="activateSeat(this)"></div>
    <div class="gem-orb gem-bbr" title="Seat 8" onclick="activateSeat(this)"></div>

    <!-- 3. Ultra-Detailed SVG Gold Filigree, Wood Frame, Side Diamonds & Top/Bottom Winged Dragons -->
    <svg class="royal-frame-svg" viewBox="0 0 450 840" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Rich Metallic Gold Gradient -->
        <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF3A8" />
          <stop offset="22%" stop-color="#F5B82E" />
          <stop offset="50%" stop-color="#B86B09" />
          <stop offset="78%" stop-color="#FFD452" />
          <stop offset="100%" stop-color="#8A4800" />
        </linearGradient>

        <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFF8C9" />
          <stop offset="45%" stop-color="#F6B93B" />
          <stop offset="100%" stop-color="#9C5708" />
        </linearGradient>

        <!-- Carved Dark Rosewood Gradient -->
        <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#221109" />
          <stop offset="25%" stop-color="#4A2714" />
          <stop offset="50%" stop-color="#2B150A" />
          <stop offset="75%" stop-color="#4A2714" />
          <stop offset="100%" stop-color="#1E0E07" />
        </linearGradient>

        <!-- Sapphire Blue Energy Channel -->
        <linearGradient id="sapphireChannel" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0038A8" />
          <stop offset="50%" stop-color="#0088FF" />
          <stop offset="100%" stop-color="#002B80" />
        </linearGradient>

        <!-- Glowing Cyan Diamond Gradient -->
        <linearGradient id="cyanDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E0FFFF" />
          <stop offset="40%" stop-color="#29E3FF" />
          <stop offset="80%" stop-color="#0077E6" />
          <stop offset="100%" stop-color="#003380" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Outer Gold Rim Base -->
      <rect x="18" y="34" width="414" height="772" rx="207" stroke="url(#goldMetal)" stroke-width="14" />

      <!-- Sapphire Blue Energy Inlay Track -->
      <rect x="33" y="49" width="384" height="742" rx="192" stroke="url(#sapphireChannel)" stroke-width="18" />

      <!-- Blue Energy Flare Bursts on Sides -->
      <g filter="url(#cyanGlow)" class="pulse-flare">
        <circle cx="33" cy="270" r="7" fill="#7DF9FF" />
        <circle cx="417" cy="270" r="7" fill="#7DF9FF" />
        <circle cx="33" cy="570" r="7" fill="#7DF9FF" />
        <circle cx="417" cy="570" r="7" fill="#7DF9FF" />
        <line x1="33" y1="245" x2="33" y2="295" stroke="#B5FCFF" stroke-width="2" />
        <line x1="417" y1="245" x2="417" y2="295" stroke="#B5FCFF" stroke-width="2" />
        <line x1="33" y1="545" x2="33" y2="595" stroke="#B5FCFF" stroke-width="2" />
        <line x1="417" y1="545" x2="417" y2="595" stroke="#B5FCFF" stroke-width="2" />
      </g>

      <!-- Inner Gold Divider Ring -->
      <rect x="44" y="60" width="362" height="720" rx="181" stroke="url(#goldBright)" stroke-width="7" />

      <!-- Carved Dark Wooden Armrest Track (Where Orbs Sit) -->
      <rect x="61" y="77" width="328" height="686" rx="164" stroke="url(#darkWood)" stroke-width="28" />
      <!-- Subtle Wood Grain Highlights -->
      <rect x="54" y="70" width="342" height="700" rx="171" stroke="#6E3B1E" stroke-width="1.5" stroke-dasharray="18 10 6 12" opacity="0.6" />
      <rect x="68" y="84" width="314" height="672" rx="157" stroke="#140904" stroke-width="2" />

      <!-- Innermost Gold Trim Border Around Blue Felt -->
      <rect x="77" y="93" width="296" height="654" rx="148" stroke="url(#goldMetal)" stroke-width="5" />

      <!-- Ornate Gold Scrollwork Filigree Arcs (Top & Bottom Curves) -->
      <g stroke="url(#goldBright)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#goldGlow)">
        <!-- Top Left & Right Scrolls -->
        <path d="M 155 44 C 110 55, 75 90, 56 135 C 48 155, 65 168, 76 150 C 86 134, 72 118, 62 128" />
        <path d="M 295 44 C 340 55, 375 90, 394 135 C 402 155, 385 168, 374 150 C 364 134, 378 118, 388 128" />
        <!-- Mid-Upper Scrolls -->
        <path d="M 30 195 C 16 215, 16 245, 30 262 C 38 270, 46 258, 36 250" />
        <path d="M 420 195 C 434 215, 434 245, 420 262 C 412 270, 404 258, 414 250" />
        <!-- Mid-Lower Scrolls -->
        <path d="M 30 645 C 16 625, 16 595, 30 578 C 38 570, 46 582, 36 590" />
        <path d="M 420 645 C 434 625, 434 595, 420 578 C 412 570, 404 582, 414 590" />
        <!-- Bottom Left & Right Scrolls -->
        <path d="M 155 796 C 110 785, 75 750, 56 705 C 48 685, 65 672, 76 690 C 86 706, 72 722, 62 712" />
        <path d="M 295 796 C 340 785, 375 750, 394 705 C 402 685, 385 672, 374 690 C 364 706, 378 722, 388 712" />
      </g>

      <!-- LEFT SIDE ORNATE DIAMOND EMBLEM -->
      <g transform="translate(33, 420)">
        <path d="M 0 -46 L 18 -20 L 30 0 L 18 20 L 0 46 L -18 20 L -30 0 L -18 -20 Z" fill="url(#goldMetal)" stroke="#FFF3A8" stroke-width="1.5" />
        <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#cyanDiamond)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cyanGlow)" />
        <polygon points="0,-14 12,0 0,14 -12,0" fill="#BFFBFF" opacity="0.65" />
      </g>

      <!-- RIGHT SIDE ORNATE DIAMOND EMBLEM -->
      <g transform="translate(417, 420)">
        <path d="M 0 -46 L 18 -20 L 30 0 L 18 20 L 0 46 L -18 20 L -30 0 L -18 -20 Z" fill="url(#goldMetal)" stroke="#FFF3A8" stroke-width="1.5" />
        <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#cyanDiamond)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#cyanGlow)" />
        <polygon points="0,-14 12,0 0,14 -12,0" fill="#BFFBFF" opacity="0.65" />
      </g>

      <!-- TOP WINGED DRAGON CREST + CYAN DIAMOND -->
      <g transform="translate(225, 56)">
        <!-- Left Wing -->
        <path d="M -22 -6 C -55 -28, -95 -24, -122 -2 C -98 -4, -84 6, -76 18 C -64 8, -52 10, -44 20 C -34 10, -24 10, -16 16 Z" fill="url(#sapphireChannel)" stroke="url(#goldBright)" stroke-width="3.5" />
        <path d="M -26 -2 L -94 -12 M -24 4 L -74 8 M -22 10 L -50 14" stroke="url(#goldBright)" stroke-width="2" />
        <!-- Right Wing -->
        <path d="M 22 -6 C 55 -28, 95 -24, 122 -2 C 98 -4, 84 6, 76 18 C 64 8, 52 10, 44 20 C 34 10, 24 10, 16 16 Z" fill="url(#sapphireChannel)" stroke="url(#goldBright)" stroke-width="3.5" />
        <path d="M 26 -2 L 94 -12 M 24 4 L 74 8 M 22 10 L 50 14" stroke="url(#goldBright)" stroke-width="2" />

        <!-- Dragon Horns & Crown -->
        <path d="M -14 -18 L -24 -42 L -6 -26 L 0 -46 L 6 -26 L 24 -42 L 14 -18 Z" fill="url(#goldBright)" stroke="#7A3E00" stroke-width="1.5" />
        <!-- Dragon Sculpted Head -->
        <path d="M -22 -14 L -14 -28 L 14 -28 L 22 -14 L 16 6 L 0 16 L -16 6 Z" fill="url(#goldMetal)" stroke="#FFF3A8" stroke-width="1.5" />
        <!-- Glowing Cyan Dragon Eyes -->
        <polygon points="-12,-12 -5,-9 -10,-5" fill="#7DF9FF" filter="url(#cyanGlow)" />
        <polygon points="12,-12 5,-9 10,-5" fill="#7DF9FF" filter="url(#cyanGlow)" />
        <!-- Snout & Fangs -->
        <path d="M -8 2 L 0 12 L 8 2" fill="none" stroke="#5C2D00" stroke-width="2" />

        <!-- Center Cyan Crest Diamond Below Dragon Jaw -->
        <g transform="translate(0, 26)">
          <polygon points="0,-18 15,0 0,18 -15,0" fill="url(#goldBright)" />
          <polygon points="0,-13 11,0 0,13 -11,0" fill="url(#cyanDiamond)" stroke="#FFFFFF" stroke-width="1.2" filter="url(#cyanGlow)" />
        </g>
      </g>

      <!-- BOTTOM WINGED DRAGON CREST + CYAN DIAMOND -->
      <g transform="translate(225, 784) scale(1, -1)">
        <!-- Left Wing -->
        <path d="M -22 -6 C -55 -28, -95 -24, -122 -2 C -98 -4, -84 6, -76 18 C -64 8, -52 10, -44 20 C -34 10, -24 10, -16 16 Z" fill="url(#sapphireChannel)" stroke="url(#goldBright)" stroke-width="3.5" />
        <path d="M -26 -2 L -94 -12 M -24 4 L -74 8 M -22 10 L -50 14" stroke="url(#goldBright)" stroke-width="2" />
        <!-- Right Wing -->
        <path d="M 22 -6 C 55 -28, 95 -24, 122 -2 C 98 -4, 84 6, 76 18 C 64 8, 52 10, 44 20 C 34 10, 24 10, 16 16 Z" fill="url(#sapphireChannel)" stroke="url(#goldBright)" stroke-width="3.5" />
        <path d="M 26 -2 L 94 -12 M 24 4 L 74 8 M 22 10 L 50 14" stroke="url(#goldBright)" stroke-width="2" />

        <!-- Dragon Horns & Crown -->
        <path d="M -14 -18 L -24 -42 L -6 -26 L 0 -46 L 6 -26 L 24 -42 L 14 -18 Z" fill="url(#goldBright)" stroke="#7A3E00" stroke-width="1.5" />
        <!-- Dragon Sculpted Head -->
        <path d="M -22 -14 L -14 -28 L 14 -28 L 22 -14 L 16 6 L 0 16 L -16 6 Z" fill="url(#goldMetal)" stroke="#FFF3A8" stroke-width="1.5" />
        <!-- Glowing Cyan Dragon Eyes -->
        <polygon points="-12,-12 -5,-9 -10,-5" fill="#7DF9FF" filter="url(#cyanGlow)" />
        <polygon points="12,-12 5,-9 10,-5" fill="#7DF9FF" filter="url(#cyanGlow)" />

        <!-- Center Cyan Crest Diamond -->
        <g transform="translate(0, 26)">
          <polygon points="0,-18 15,0 0,18 -15,0" fill="url(#goldBright)" />
          <polygon points="0,-13 11,0 0,13 -11,0" fill="url(#cyanDiamond)" stroke="#FFFFFF" stroke-width="1.2" filter="url(#cyanGlow)" />
        </g>
      </g>

      <!-- Gold Rim Light Flares (Top-Right & Bottom-Left Specular Shine) -->
      <circle cx="382" cy="112" r="14" fill="#FFF6B3" opacity="0.55" filter="url(#goldGlow)" class="pulse-flare" />
      <circle cx="68" cy="728" r="14" fill="#FFF6B3" opacity="0.55" filter="url(#goldGlow)" class="pulse-flare" />
    </svg>
  </div>

  <script>
    // 1. Procedural Royal Velvet Damask Texture on Canvas
    const canvas = document.getElementById('feltCanvas');
    const ctx = canvas.getContext('2d');

    function drawRoyalFeltPattern() {
      canvas.width = 320;
      canvas.height = 640;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fine fabric grain
      for (let i = 0; i < 4500; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.22)';
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      // Ornate Royal Diamond Filigree Pattern
      ctx.strokeStyle = 'rgba(130, 210, 255, 0.25)';
      ctx.lineWidth = 1.2;
      const step = 42;
      for (let y = 0; y < canvas.height + step; y += step) {
        for (let x = 0; x < canvas.width + step; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, y - 14);
          ctx.quadraticCurveTo(x + 8, y - 8, x + 14, y);
          ctx.quadraticCurveTo(x + 8, y + 8, x, y + 14);
          ctx.quadraticCurveTo(x - 8, y + 8, x - 14, y);
          ctx.quadraticCurveTo(x - 8, y - 8, x, y - 14);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }
    drawRoyalFeltPattern();

    // 2. Interactive Gem Orb Seat Selection
    function activateSeat(el) {
      document.querySelectorAll('.gem-orb').forEach(orb => {
        orb.style.boxShadow = '0 0 14px rgba(0, 217, 255, 0.95), 0 3px 6px rgba(0, 0, 0, 0.85)';
        orb.style.borderColor = '#f7c348';
      });
      el.style.boxShadow = '0 0 26px #00ffff, 0 0 14px #ffd700';
      el.style.borderColor = '#ffffff';
    }

    // 3. Quick Interactive Card Deal Demo
    const ranks = ['A', 'K', 'Q', 'J', '10', '9', '8'];
    const suits = [
           { sym: '♥', color: 'text-rose-600' },
      { sym: '♦', color: 'text-rose-600' },
      { sym: '♠', color: 'text-slate-900' },
      { sym: '♣', color: 'text-slate-900' }
    ];

    function dealRandomHand() {
      const container = document.getElementById('dealtCards');
      container.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const r = ranks[Math.floor(Math.random() * ranks.length)];
        const s = suits[Math.floor(Math.random() * suits.length)];
        const card = document.createElement('div');
        card.className = `card-mini ${s.color}`;
        card.style.transform = 'scale(0.7) rotate(-8deg)';
        card.innerHTML = `<span>${r}</span><span>${s.sym}</span>`;
        container.appendChild(card);
        requestAnimationFrame(() => {
          card.style.transform = 'scale(1) rotate(0deg)';
        });
      }
    }
  </script>
</body>
</html>
